[project]
name = "invoice-api-practice"
version = "0.1.0"
description = "Invoice management API built for full-stack interview practice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    # Starlette >= 1.9 requires httpx2 for fastapi.testclient.
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic migrations are machine-generated. Linting them adds noise and fights
# with `alembic revision --autogenerate`, so they are excluded on purpose.
# Markdown is excluded because ruff formats Python blocks inside .md files,
# which would silently rewrite documentation and make `ruff format --check`
# fail on prose edits.
extend-exclude = ["alembic/versions", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
# The local `alembic/` directory shadows the installed `alembic` package, so the
# import order has to be declared explicitly.
known-first-party = ["app"]
known-third-party = ["alembic"]
