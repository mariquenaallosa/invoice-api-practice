services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice
    ports:
      # 5433 on the host so it does not clash with other local Postgres instances.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the `invoice_test` database on first initialization.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
    # One-shot job: applies the schema and exits. It is not a long running
    # service, so `api` waits for it to finish successfully.
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://invoice:invoice@postgres:5432/invoice
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://invoice:invoice@postgres:5432/invoice
      APP_ENV: development
      LOG_LEVEL: INFO
    ports:
      # 8010 on the host because port 8000 is often taken by another local app.
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  floci:
    image: floci/floci:latest
    # Optional local AWS emulator, used to practice the Terraform configuration
    # without an AWS account. It lives behind a profile so it does not start
    # with the normal stack:
    #   docker compose --profile aws-emulator up -d floci
    profiles: ["aws-emulator"]
    ports:
      - "4566:4566"
    volumes:
      # Lets Floci launch real Docker containers, which is what makes an ECS
      # task actually run the API image.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
    healthcheck:
      # The image only ships bash, so the probe uses bash builtins over /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/4566;
          printf "GET /_localstack/health HTTP/1.0\r\nHost: localhost:4566\r\n\r\n" >&3;
          read -r -t 3 line <&3; [[ $$line == *"200"* ]]'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  pgdata:
